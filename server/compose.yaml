services:
  db:
    image: postgres:16-alpine
    container_name: phuong-anh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: phuong_anh
    ports:
      - "5432:5432"
    volumes:
      - phuong_anh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phuong_anh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  phuong_anh_postgres_data:
